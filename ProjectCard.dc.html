<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/org-nico-design-system-4458e0ae-fd13-4aad-8573-26ff16642555/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/org-nico-design-system-4458e0ae-fd13-4aad-8573-26ff16642555/tokens/colors.css">
  <link rel="stylesheet" href="_ds/org-nico-design-system-4458e0ae-fd13-4aad-8573-26ff16642555/tokens/typography.css">
  <link rel="stylesheet" href="_ds/org-nico-design-system-4458e0ae-fd13-4aad-8573-26ff16642555/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/org-nico-design-system-4458e0ae-fd13-4aad-8573-26ff16642555/styles.css">
  <script src="_ds/org-nico-design-system-4458e0ae-fd13-4aad-8573-26ff16642555/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
</helmet>
<div onClick="{{ onSelect }}" style="display:flex;flex-direction:column;min-height:0;max-width:100%;box-sizing:border-box;background:var(--white);border:1px solid var(--border-subtle);border-radius:24px;overflow:hidden;cursor:pointer;transition:transform 200ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms cubic-bezier(0.16,1,0.3,1)" style-hover="transform:translateY(-4px);box-shadow:0 8px 24px rgba(28,28,28,0.08)">
  <div style="position:relative;width:100%;aspect-ratio:4 / 3;flex:none;overflow:hidden;background:var(--grey-100)">
    <image-slot id="{{ slotId }}" src="{{ imgSrc }}" shape="rect" placeholder="{{ title }}"></image-slot>
    <sc-if value="{{ showIndex }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute;left:14px;top:14px;font-family:var(--font-longform);font-size:12px;font-weight:600;color:var(--charcoal-500);background:rgba(244,244,244,0.92);padding:5px 9px;border-radius:999px;pointer-events:none">{{ n }}</span>
    </sc-if>
    <span style="position:absolute;right:14px;top:14px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--white);border-radius:999px;pointer-events:none;color:var(--charcoal-500)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
    </span>
  </div>
  <div style="padding:18px 20px;display:flex;justify-content:space-between;align-items:baseline;gap:14px">
    <h3 style="font-family:var(--font-heading);font-weight:700;font-size:20px;letter-spacing:-0.02em;margin:0;line-height:1.05">{{ title }}</h3>
    <span style="display:inline-flex;align-items:center;gap:7px;font-family:var(--font-longform);font-size:12px;color:var(--grey-400);white-space:nowrap">
      <span style="width:7px;height:7px;border-radius:50%;background:var(--charcoal-500);display:inline-block"></span>{{ cat }}
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:340},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Proyecto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cat&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Branding&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;n&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;proj-x&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showIndex&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
